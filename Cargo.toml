[package]
name = "quartermaster"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "qm"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"

[dev-dependencies]
regex = "1"
tempfile = "3"
