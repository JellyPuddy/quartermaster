# The qm overview video. Render with `ruby showcase/video/render.rb` (see showcase/README.md).
#
# Scene keys: id, caption (on-screen text), visual (a PNG under showcase/out/, or a list of
# them / {file, duration, focus} for a sequence), optional focus [x, y, w, h] in the source
# image's pixels to cut to a close-up of, optional voiceover (spoken text; its length sets the
# scene's duration), optional duration (seconds; used when there is no voiceover), optional
# style (lower_third or title). A shot that doesn't exist yet renders as a placeholder card.
#
# Every shots/<id>.png is a shot in showcase/shots/shots.yml (`ruby showcase/shots/capture.rb`).
# Full-window shots are 3840x2160 (1920x1080 at 2x), so focus rects are in those pixels.
settings:
  voice: Daniel
  rate: 180
  width: 1920
  height: 1080
  fps: 30
  crossfade: 0.6
  caption:
    style: lower_third

scenes:
  - id: intro
    style: title
    visual: shots/board.png
    caption: "Quartermaster: keeping track of many Claude Code sessions"
    voiceover: >-
      This is Quartermaster, or q m. It watches every Claude Code session you run,
      and turns them into work items you can actually keep track of.

  # Story 1: "I lost track of what my sessions were doing"
  - id: board
    visual: shots/board.png
    focus: [34, 135, 2835, 1595]
    caption: Every session lands on a work item, with its notes, branch and PR
    voiceover: >-
      Every session is captured automatically and attached to a work item.
      The board shows what is in progress, what is in the fridge, and what is done.
  - id: item-detail
    visual:
      - file: shots/item-detail.png
        focus: [2259, 339, 1581, 889]
      - shots/stale-item.png
    caption: Notes, sessions and links stay with the work, not in your head
    voiceover: >-
      Open an item and you get its notes, decisions and blockers, the sessions
      that worked on it, and its branch, pull request and issue.
      Items you have not touched in a while are flagged as stale.

  # Story 2: "Which session is waiting on me?"
  - id: attention
    visual:
      - file: shots/attention.png
        focus: [0, 113, 2259, 1271]
      - shots/inbox.png
    caption: See at a glance which chats wait on you and which are still working
    voiceover: >-
      Which session is waiting on me? The attention view answers that.
      Chats waiting on you float to the top, Claude's busy ones and background work are marked,
      and unattached sessions collect in an inbox.

  # Story 3: "Switching context is expensive"
  - id: chats
    visual: shots/chat.png
    caption: Chats run inside the GUI, with their history right above them
    voiceover: >-
      Chats run right inside the GUI, with the earlier history of the work item above them,
      so switching back to a task takes seconds instead of minutes.
  - id: rotation
    visual:
      - shots/context-meter.png
      - file: shots/chat-rotation.png
        focus: [599, 124, 2519, 1417]
    caption: When context fills up, rotate to a fresh chat that carries the notes over
    voiceover: >-
      A meter shows how full the context is. When it gets close, rotate to a fresh chat
      that carries the open notes and decisions forward.
  - id: aside
    visual:
      - file: shots/aside.png
        focus: [599, 407, 2519, 1417]
    caption: Quick side questions go in an aside, not in the work item
    voiceover: >-
      Quick side questions go in an aside: a separate chat that never clutters the work item,
      unless you promote its answer to a note.

  # Story 4: "Reviewing what Claude did"
  - id: diff
    visual:
      - file: shots/diff.png
        focus: [565, 655, 2598, 1461]
      - file: shots/since-prompt.png
        focus: [565, 136, 2372, 1335]
    caption: Review the diff for the branch, or just since your last prompt
    voiceover: >-
      To review what Claude did, the diff pane shows the whole branch, or only what changed
      since your last prompt. Mark files as viewed and leave inline comments as you go.
  - id: prs
    visual:
      - shots/review-draft.png
      - file: shots/pr-threads.png
        focus: [565, 316, 2372, 1335]
      - file: shots/prs.png
        focus: [881, 678, 2078, 1170]
    caption: Pull requests, checks, review threads and stacks in one view
    voiceover: >-
      Comments become a GitHub review draft. The pull request view shows checks,
      open review threads, and how a stack of branches fits together.

  # Story 5: "From issue to merged"
  - id: issues
    visual:
      - file: shots/issue-draft.png
        focus: [1999, 124, 1841, 1035]
      - file: shots/cleanup.png
        focus: [1119, 629, 1600, 900]
    caption: Draft issues, start work from one, clean up the worktree when it's merged
    voiceover: >-
      From issue to merged: draft issues with Claude, start a work item and a worktree
      from an issue, and clean up the worktree once the pull request is merged.

  # Story 6: "Away from my desk"
  - id: phone
    visual: shots/phone.png
    caption: A phone page shows what needs you when you're away from your desk
    voiceover: >-
      Away from your desk? A phone page shows what is waiting on you, so you know
      whether it is worth walking back.

  - id: side-panel
    visual:
      - file: shots/side-panel.png
        focus: [2485, 0, 1355, 762]
      - shots/batch-board.png
    caption: Usage, cost, rate limits and build progress in the side panel
    voiceover: >-
      And the side panel keeps usage, cost, rate limits and build progress in view.

  - id: outro
    style: title
    visual: shots/board.png
    caption: "Quartermaster: less juggling, more building"
    voiceover: >-
      Less juggling, more building. That's Quartermaster.
